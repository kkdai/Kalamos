#:schema https://www.schemastore.org/prek.json

[[repos]]
repo = "builtin"
hooks = [
    { id = "check-merge-conflict" },
    { id = "check-json" },
    { id = "check-toml" },
    { id = "check-yaml" },
    { id = "end-of-file-fixer" },
    { id = "trailing-whitespace", args = ["--markdown-linebreak-ext=md"] },
]

[[repos]]
repo = "https://github.com/zizmorcore/zizmor-pre-commit"
rev = "v1.30.1"
hooks = [{ id = "zizmor" }]

[[repos]]
repo = "https://github.com/biomejs/pre-commit"
rev = "v2.0.6"
hooks = [
    { id = "biome-check", additional_dependencies = ["@biomejs/biome@2.1.1"] },
]

[[repos]]
repo = "local"

[[repos.hooks]]
id = "tsc-rs"
name = "TypeScript type check (tsc-rs)"
entry = "tsc-rs --noEmit"
language = "node"
additional_dependencies = ["tsc-rs@0.8.0"]
files = '^(src/.*\.[cm]?tsx?|tsconfig\.json|package(-lock)?\.json)$'
pass_filenames = false
