<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kalamos</title>
    <style>
      html,
      body,
      #app {
        margin: 0;
        padding: 0;
        height: 100%;
        width: 100%;
        overflow: hidden;
      }
      #app {
        display: flex;
        flex-direction: column;
        height: 100vh;
        overflow: hidden;
      }
      #recovery-banner {
        display: none;
        flex-shrink: 0;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 8px 16px;
        border-bottom: 1px solid var(--k-divider, #d9cdb3);
        background-color: var(--k-surface, #ede4cf);
        font-family: var(--k-font-ui, sans-serif);
        font-size: 14px;
      }
      #recovery-banner[data-visible="true"] {
        display: flex;
      }
      #recovery-actions {
        display: flex;
        gap: 8px;
      }
      #editor-container {
        flex: 1;
        min-height: 0;
        overflow: hidden;
        display: flex;
        flex-direction: column;
      }
      #editor-container .cm-editor {
        flex: 1;
        height: 100%;
        min-height: 0;
        overflow: hidden;
      }
      #editor-container .cm-scroller {
        height: 100%;
        overflow-y: auto;
      }
      #status {
        flex-shrink: 0;
        min-height: 24px;
        padding: 4px 16px;
        font-family: var(--k-font-ui, sans-serif);
        font-size: 12px;
        border-top: 1px solid transparent;
      }
      #status[data-error="true"] {
        border-top-color: var(--k-divider, #d9cdb3);
        color: var(--k-link, #a4552f);
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="recovery-banner" role="alert" data-visible="false">
        <span id="recovery-message">偵測到上次未儲存的內容，是否還原？</span>
        <div id="recovery-actions">
          <button type="button" id="recovery-restore-btn">還原</button>
          <button type="button" id="recovery-discard-btn">捨棄</button>
        </div>
      </div>
      <main id="editor-container" aria-label="Markdown Editor"></main>
      <div id="status" data-testid="status" role="status" aria-live="polite"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
