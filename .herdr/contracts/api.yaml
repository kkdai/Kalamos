openapi: 3.1.0
info:
  title: Kalamos IPC contract (Tauri commands)
  version: 0.1.0
  description: |
    The only interface between the WebView (src/) and Rust (src-tauri/).
    Each Tauri command is modeled as `POST /invoke/<command>`; the request body is the
    `invoke(<command>, args)` argument object (camelCase keys, as Tauri passes them),
    the 200 body is the resolved value. Failures reject with `AppError`.
    Events emitted by Rust are listed under `x-events`.
    All paths are absolute local filesystem paths (strings).
paths:
  /invoke/open_file:
    post:
      summary: Read a UTF-8 text file exactly as stored.
      requestBody:
        content: { application/json: { schema: { $ref: '#/components/schemas/PathArg' }, example: { path: /tmp/notes/a.md } } }
      responses:
        '200': { description: file content, content: { application/json: { schema: { type: string }, example: "# Title\n\nHello\n" } } }
        default: { $ref: '#/components/responses/Error' }
  /invoke/save_file:
    post:
      summary: Atomically write content (temp file + rename). Bytes written == content bytes.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [path, content]
              properties: { path: { type: string }, content: { type: string } }
            example: { path: /tmp/notes/a.md, content: "# Title\n" }
      responses:
        '200': { description: saved, content: { application/json: { schema: { $ref: '#/components/schemas/FileMeta' } } } }
        default: { $ref: '#/components/responses/Error' }
  /invoke/read_tree:
    post:
      summary: List a folder recursively; only folders and .md/.markdown files; skips hidden, .git, node_modules.
      requestBody:
        content: { application/json: { schema: { $ref: '#/components/schemas/PathArg' }, example: { path: /tmp/notes } } }
      responses:
        '200': { description: tree root, content: { application/json: { schema: { $ref: '#/components/schemas/TreeNode' } } } }
        default: { $ref: '#/components/responses/Error' }
  /invoke/list_files:
    post:
      summary: Flat list of all markdown files under a folder, sorted by mtime desc, with first-line excerpt.
      requestBody:
        content: { application/json: { schema: { $ref: '#/components/schemas/PathArg' } } }
      responses:
        '200':
          description: files
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/FileEntry' } }
              example: [{ path: /tmp/notes/a.md, name: a.md, mtimeMs: 1763520000000, excerpt: "# Title" }]
        default: { $ref: '#/components/responses/Error' }
  /invoke/watch_folder:
    post:
      summary: Start watching a folder (replaces any previous watch). Emits `fs-changed`.
      requestBody:
        content: { application/json: { schema: { $ref: '#/components/schemas/PathArg' } } }
      responses:
        '200': { description: watching, content: { application/json: { schema: { type: 'null' } } } }
        default: { $ref: '#/components/responses/Error' }
  /invoke/create_file:
    post:
      summary: Create an empty file (fails with kind=AlreadyExists if present).
      requestBody:
        content: { application/json: { schema: { $ref: '#/components/schemas/PathArg' } } }
      responses:
        '200': { description: created, content: { application/json: { schema: { $ref: '#/components/schemas/FileMeta' } } } }
        default: { $ref: '#/components/responses/Error' }
  /invoke/rename_path:
    post:
      summary: Rename/move a file or folder.
      requestBody:
        content:
          application/json:
            schema: { type: object, required: [from, to], properties: { from: { type: string }, to: { type: string } } }
      responses:
        '200': { description: renamed, content: { application/json: { schema: { type: 'null' } } } }
        default: { $ref: '#/components/responses/Error' }
  /invoke/trash_path:
    post:
      summary: Move a file or folder to the system Trash.
      requestBody:
        content: { application/json: { schema: { $ref: '#/components/schemas/PathArg' } } }
      responses:
        '200': { description: trashed, content: { application/json: { schema: { type: 'null' } } } }
        default: { $ref: '#/components/responses/Error' }
  /invoke/write_recovery:
    post:
      summary: Store unsaved content for a document id in app data `recovery/<docId>.json`.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [docId, content]
              properties:
                docId: { type: string, description: 'uuid generated by FE per untitled/dirty document' }
                path: { type: [string, 'null'], description: 'file path if the document has one' }
                content: { type: string }
      responses:
        '200': { description: stored, content: { application/json: { schema: { type: 'null' } } } }
        default: { $ref: '#/components/responses/Error' }
  /invoke/list_recovery:
    post:
      summary: List recovery entries left from a previous session (newest first).
      responses:
        '200':
          description: entries
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/RecoveryEntry' } }
  /invoke/clear_recovery:
    post:
      summary: Delete one recovery entry (after restore, discard, or successful save).
      requestBody:
        content: { application/json: { schema: { type: object, required: [docId], properties: { docId: { type: string } } } } }
      responses:
        '200': { description: cleared, content: { application/json: { schema: { type: 'null' } } } }
  /invoke/get_settings:
    post:
      summary: Read settings (defaults if missing).
      responses:
        '200': { description: settings, content: { application/json: { schema: { $ref: '#/components/schemas/Settings' } } } }
  /invoke/set_settings:
    post:
      summary: |
        Replace settings (persisted to app data settings.json). Protected keys `uploadCommand` and
        `uploadArgs` (IM-05) are ignored: the values already in settings.json are kept (null / [] when
        absent), so the WebView can never choose the program `upload_images` runs. get_settings still
        returns them.
      requestBody:
        content: { application/json: { schema: { type: object, required: [settings], properties: { settings: { $ref: '#/components/schemas/Settings' } } } } }
      responses:
        '200': { description: saved, content: { application/json: { schema: { type: 'null' } } } }
        default: { $ref: '#/components/responses/Error' }
  /invoke/list_themes:
    post:
      summary: Built-in themes plus app data `themes/*.css` custom themes.
      responses:
        '200':
          description: themes
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/ThemeInfo' } }
              example: [{ id: papyros, name: Papyros, builtin: true }, { id: melan, name: Melan, builtin: true }, { id: custom:night, name: night, builtin: false }]
  /invoke/read_theme_css:
    post:
      summary: Return the CSS text of a custom theme (id `custom:<file stem>`).
      requestBody:
        content: { application/json: { schema: { type: object, required: [id], properties: { id: { type: string } } } } }
      responses:
        '200': { description: css, content: { application/json: { schema: { type: string } } } }
        default: { $ref: '#/components/responses/Error' }
  /invoke/import_image:
    post:
      summary: |
        Copy an image file into `<document folder>/assets/` (name collisions get `-1`, `-2`… suffixes)
        and return the Markdown-ready relative path. Accepts png/jpg/jpeg/gif/webp/svg only; both the
        extension and the file header (magic bytes; svg: text must start with `<svg`/`<?xml`/`<!--`)
        are checked. Spaces and `%()<>` in the file name are percent-encoded in `relativePath`.
        Fails with kind=InvalidPath (unsupported extension / empty docPath) or Parse (header mismatch).
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [docPath, sourcePath]
              properties: { docPath: { type: string }, sourcePath: { type: string } }
            example: { docPath: /tmp/notes/a.md, sourcePath: /tmp/kalamos-test/Desktop/my cat.png }
      responses:
        '200': { description: imported, content: { application/json: { schema: { $ref: '#/components/schemas/ImportedImage' }, example: { relativePath: assets/my%20cat.png } } } }
        default: { $ref: '#/components/responses/Error' }
  /invoke/import_image_bytes:
    post:
      summary: |
        Store clipboard image bytes as `<document folder>/assets/pasted-YYYYMMDD-HHMMSS.<ext>` (local time,
        same collision suffixes and validation as import_image). `bytes` is base64 (a `data:...;base64,` prefix is tolerated).
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [docPath, bytes, ext]
              properties: { docPath: { type: string }, bytes: { type: string, description: base64 }, ext: { type: string, enum: [png, jpg, jpeg, gif, webp, svg] } }
            example: { docPath: /tmp/notes/a.md, bytes: iVBORw0KGgo..., ext: png }
      responses:
        '200': { description: imported, content: { application/json: { schema: { $ref: '#/components/schemas/ImportedImage' }, example: { relativePath: assets/pasted-20261119-080509.png } } } }
        default: { $ref: '#/components/responses/Error' }
  /invoke/allow_asset_dir:
    post:
      summary: |
        Add a folder (recursively) to the Tauri asset protocol scope so local images under it can be
        displayed via convertFileSrc. A file path allows its parent folder. open_file, save_file and
        watch_folder also do this automatically for the document / opened folder.
      requestBody:
        content: { application/json: { schema: { $ref: '#/components/schemas/PathArg' }, example: { path: /tmp/notes } } }
      responses:
        '200': { description: allowed, content: { application/json: { schema: { type: 'null' } } } }
        default: { $ref: '#/components/responses/Error' }
  /invoke/export_pdf:
    post:
      summary: |
        EX-01 (macOS). Render a standalone HTML page (built by src/export/html.ts; no scripts — the
        export WebView runs with JavaScript disabled, local images as file:// URLs) to an A4 PDF
        (margins 18 mm top/bottom, 20 mm left/right; no header/footer) at `outPath`, then add
        bookmarks: one per heading, nested by level (a skipped level nests under the nearest
        shallower heading), pointing at the page where the heading text appears (matched in order,
        so repeated titles map to successive occurrences; not found → previous heading's page).
        Written to a temp file next to `outPath` and renamed into place. Only one export runs at a
        time (a second call fails with kind=Io); the whole export times out after 60 s (kind=Io).
        Fails with kind=InvalidPath (empty path / directory) or NotFound (parent folder missing).
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [html, outPath, headings]
              properties:
                html: { type: string, description: complete HTML document }
                outPath: { type: string }
                headings: { type: array, items: { $ref: '#/components/schemas/ExportHeading' }, description: document order }
            example: { html: "<!DOCTYPE html><html>…</html>", outPath: /tmp/notes/a.pdf, headings: [{ level: 1, text: Title, id: title }] }
      responses:
        '200': { description: exported, content: { application/json: { schema: { $ref: '#/components/schemas/FileMeta' } } } }
        default: { $ref: '#/components/responses/Error' }
  /invoke/pandoc_status:
    post:
      summary: |
        EX-02/03. Whether Pandoc is installed. Looks up `pandoc` in PATH, then /opt/homebrew/bin and
        /usr/local/bin (GUI apps on macOS do not get the shell PATH). The result is cached;
        `recheck: true` forces a new lookup. Never fails.
      requestBody:
        content:
          application/json:
            schema: { type: object, properties: { recheck: { type: boolean, default: false } } }
      responses:
        '200': { description: status, content: { application/json: { schema: { $ref: '#/components/schemas/PandocStatus' } } } }
  /invoke/export_pandoc:
    post:
      summary: |
        EX-02. Convert `markdown` with Pandoc (argument vector, no shell; Markdown on stdin;
        `-f markdown+tex_math_dollars+footnotes+yaml_metadata_block+pipe_tables+task_lists -t <writer>`,
        `--resource-path=<doc folder>:<imageRoot>` so relative images are embedded, `--standalone` for
        latex / mediawiki, `--toc` when `toc`). The frontend sends the document with local image paths
        made absolute, `<img>` tags turned into `![](){width=…}` and `[TOC]` lines removed
        (src/export/pandoc.ts). Written to a temp file next to `outPath` and renamed into place;
        killed after 120 s (kind=Io). Pandoc missing → kind=NotFound ("找不到 Pandoc：請先安裝（brew install pandoc）");
        non-zero exit → kind=Io with the stderr tail; unknown format / empty path / directory →
        InvalidPath; parent folder missing → NotFound.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [docPath, markdown, format, outPath]
              properties:
                docPath: { type: [string, 'null'] }
                markdown: { type: string }
                format: { $ref: '#/components/schemas/PandocFormat' }
                outPath: { type: string }
                imageRoot: { type: [string, 'null'], default: null, description: IM-04 root in effect (setting or typora-root-url) }
                toc: { type: boolean, default: false }
            example: { docPath: /tmp/notes/a.md, markdown: "# Title", format: docx, outPath: /tmp/notes/a.docx, imageRoot: null, toc: false }
      responses:
        '200': { description: exported, content: { application/json: { schema: { $ref: '#/components/schemas/FileMeta' } } } }
        default: { $ref: '#/components/responses/Error' }
  /invoke/import_pandoc:
    post:
      summary: |
        EX-03. Convert a .docx / .odt / .epub / .tex / .html(.htm) / .wiki(.mediawiki) file (reader chosen
        from the extension) to Markdown (`--sandbox -t gfm-tex_math_gfm+tex_math_dollars+footnotes --wrap=none`; the
        sandbox stops a downloaded file from pulling other local files in via \input / <img src=…>, so
        pandoc ≥ 2.15 is required — older or unknown versions fail with kind=Io
        "Pandoc 版本過舊，匯入需要 2.15 以上" without running pandoc). A built-in Lua filter (written to the
        per-import temp folder, passed as --lua-filter) turns figures into plain `![caption](path)` and drops
        image width/height, so no <figure>/<img> HTML appears; zero-width spaces (U+200B) are removed. Embedded
        images are extracted to a new temp folder (`mediaDir`); the Markdown references them by
        absolute path. The frontend opens the result as a new, dirty, untitled document.
        Errors: unsupported extension / empty path → InvalidPath; file or Pandoc missing → NotFound;
        non-zero exit or 120 s timeout → Io; non-UTF-8 output → Parse.
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PathArg' }
            example: { path: /tmp/notes/report.docx }
      responses:
        '200': { description: converted, content: { application/json: { schema: { $ref: '#/components/schemas/PandocImport' } } } }
        default: { $ref: '#/components/responses/Error' }
  /invoke/upload_images:
    post:
      summary: |
        IM-05. Upload local images with the uploader configured in settings (`uploadCommand` +
        `uploadArgs`; never from document content). Runs `uploadCommand uploadArgs… paths…` as an
        argument vector (no shell; a bare command name is looked up in PATH, /opt/homebrew/bin,
        /usr/local/bin). The command must print one http(s) URL per image on stdout; the last N URL
        lines are returned in input order. Every path must be an absolute, existing file with a
        png/jpg/jpeg/gif/webp/svg extension (directories refused) — validated before anything runs.
        Errors: uploader not configured → NotFound "尚未設定圖床上傳指令（見 docs/image-upload.md）";
        bad path → InvalidPath / NotFound; non-zero exit (stderr tail in the message) or 60 s timeout
        (child killed) → Io; fewer URLs than images → Parse. No partial results.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [paths]
              properties: { paths: { type: array, items: { type: string } } }
            example: { paths: [/tmp/kalamos-test/notes/assets/cat.png] }
      responses:
        '200': { description: uploaded, content: { application/json: { schema: { $ref: '#/components/schemas/UploadResult' }, example: { urls: [https://img.example.test/cat.png] } } } }
        default: { $ref: '#/components/responses/Error' }
components:
  schemas:
    PandocFormat: { type: string, enum: [docx, odt, latex, mediawiki, epub] }
    PandocStatus:
      type: object
      required: [available, path, version]
      properties:
        available: { type: boolean }
        path: { type: [string, 'null'], description: absolute path of the pandoc binary found }
        version: { type: [string, 'null'], example: 3.1.11 }
    PandocImport:
      type: object
      required: [markdown, mediaDir]
      properties:
        markdown: { type: string }
        mediaDir: { type: [string, 'null'], description: temp folder holding extracted images, if any }
    PathArg: { type: object, required: [path], properties: { path: { type: string } } }
    FileMeta:
      type: object
      required: [path, mtimeMs, size]
      properties: { path: { type: string }, mtimeMs: { type: integer }, size: { type: integer } }
    TreeNode:
      type: object
      required: [name, path, kind]
      properties:
        name: { type: string }
        path: { type: string }
        kind: { type: string, enum: [dir, file] }
        children: { type: array, items: { $ref: '#/components/schemas/TreeNode' }, description: 'dirs only; sorted dirs first, then name (case-insensitive)' }
    FileEntry:
      type: object
      required: [path, name, mtimeMs, excerpt]
      properties: { path: { type: string }, name: { type: string }, mtimeMs: { type: integer }, excerpt: { type: string, description: 'first non-empty line, max 120 chars' } }
    RecoveryEntry:
      type: object
      required: [docId, content, savedAtMs]
      properties: { docId: { type: string }, path: { type: [string, 'null'] }, content: { type: string }, savedAtMs: { type: integer } }
    Settings:
      type: object
      properties:
        theme: { type: string, default: system, description: 'system | papyros | melan | custom:<stem>' }
        lastFolder: { type: [string, 'null'], default: null }
        sidebarVisible: { type: boolean, default: false }
        sidebarTab: { type: string, enum: [tree, list, outline], default: tree }
        sourceMode: { type: boolean, default: false }
        codeLineNumbers: { type: boolean, default: false }
        mathAutoNumber: { type: boolean, default: false }
        imageRootDir: { type: [string, 'null'], default: null, description: "IM-04 image root folder: '/'-rooted image paths resolve under it; a document's front matter typora-root-url overrides it" }
        focusMode: { type: boolean, default: false, description: 'WM-01 Ataraxia focus mode (F8)' }
        typewriterMode: { type: boolean, default: false, description: 'WM-02 Stichos typewriter mode (F9)' }
        uploadCommand: { type: [string, 'null'], default: null, description: 'IM-05 image upload program (absolute path or a name in PATH); null = not configured. Read-only for the app: only set by editing settings.json (set_settings keeps the stored value)' }
        uploadArgs: { type: array, items: { type: string }, default: [], description: 'IM-05 fixed arguments placed before the image paths. Read-only for the app, like uploadCommand' }
        uploadOnInsert: { type: boolean, default: false, description: 'IM-05 upload pasted / dropped images right after importing them' }
        autoPairBrackets: { type: boolean, default: true, description: 'ED-09 auto-close ( [ { " '' and full-width 「」『』（）【】《》“”‘’ (Cmd+Opt+P)' }
        autoPairMarkdown: { type: boolean, default: false, description: 'ED-09 auto-close Markdown * _ ` ~ (Cmd+Opt+Shift+P)' }
    UploadResult:
      type: object
      required: [urls]
      properties: { urls: { type: array, items: { type: string }, description: one URL per input path, same order } }
    ImportedImage:
      type: object
      required: [relativePath]
      properties: { relativePath: { type: string, description: "'/'-separated, relative to the document folder, e.g. assets/cat.png" } }
    ExportHeading:
      type: object
      required: [level, text, id]
      properties:
        level: { type: integer, minimum: 1, maximum: 6 }
        text: { type: string, description: plain heading text (markup stripped), used as bookmark label and to locate the page }
        id: { type: string, description: 'GitHub-style slug, same as #5 heading links (duplicates get -1, -2…)' }
    ThemeInfo:
      type: object
      required: [id, name, builtin]
      properties: { id: { type: string }, name: { type: string }, builtin: { type: boolean } }
    AppError:
      type: object
      required: [kind, message]
      properties:
        kind: { type: string, enum: [NotFound, AlreadyExists, PermissionDenied, InvalidPath, Io, Watch, Parse] }
        message: { type: string }
  responses:
    Error:
      description: invoke rejected
      content: { application/json: { schema: { $ref: '#/components/schemas/AppError' } } }
x-events:
  fs-changed:
    description: Emitted (debounced 200 ms) when anything under the watched folder changes.
    payload: { type: object, required: [root, paths], properties: { root: { type: string }, paths: { type: array, items: { type: string } } } }
    example: { root: /tmp/notes, paths: [/tmp/notes/new.md] }
