name: Release

on:
  push:
    branches: [main]
    paths: [CHANGELOG.md]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: macos-15
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Read version and release notes
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version=$(node -p 'require("./package.json").version')
          tag="v$version"
          if gh release view "$tag" --json isDraft --jq '.isDraft' | grep -qx false; then
            echo "$tag is already published."
            exit 0
          fi

          mkdir release-assets
          awk -v heading="## $version" '
            found && /^## / { exit }
            found { print }
            $0 == heading { found = 1 }
            END { if (!found) exit 1 }
          ' CHANGELOG.md > release-assets/notes.md || {
            echo "::error::No changelog entry for $tag."
            exit 1
          }
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Set up Rust
        if: steps.release.outputs.tag
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca
        with:
          toolchain: stable
          targets: aarch64-apple-darwin

      - name: Install dependencies
        if: steps.release.outputs.tag
        run: npm ci

      - name: Build macOS DMG
        if: steps.release.outputs.tag
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          npm run tauri build -- --ci --target aarch64-apple-darwin --bundles dmg -- --locked
          cp "src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/Kalamos_${TAG#v}_aarch64.dmg" release-assets/

      - name: Upload release files
        if: steps.release.outputs.tag
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          path: release-assets/
          if-no-files-found: error

  publish:
    needs: build
    if: needs.build.outputs.tag
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release-${{ needs.build.outputs.tag }}
      cancel-in-progress: false
    steps:
      - name: Download release files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: release-assets

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          if is_draft=$(gh release view "$TAG" --json isDraft --jq '.isDraft'); then
            if [[ "$is_draft" == false ]]; then
              echo "$TAG is already published."
              exit 0
            fi
            echo "::error::Resolve the existing draft for $TAG before retrying."
            exit 1
          fi

          if target=$(gh api "repos/$GITHUB_REPOSITORY/commits/refs/tags/$TAG" --jq '.sha') && [[ "$target" != "$GITHUB_SHA" ]]; then
            echo "::error::Tag $TAG points to $target, not $GITHUB_SHA."
            exit 1
          fi

          gh release create "$TAG" --target "$GITHUB_SHA" --title "Kalamos $TAG" \
            --notes-file release-assets/notes.md "release-assets/Kalamos_${TAG#v}_aarch64.dmg"
