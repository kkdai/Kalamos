[package]
name = "kalamos"
version = "0.1.1"
description = "Kalamos — Typora-style WYSIWYM Markdown desktop editor"
authors = ["Evan Lin"]
edition = "2021"
license = "MIT"

[lib]
name = "kalamos_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
notify = "6"
trash = "5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
base64 = "0.22"
regex = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[dev-dependencies]
tempfile = "3"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = "0.3"
objc2-core-foundation = "0.3"
objc2-foundation = "0.3"
objc2-pdf-kit = "0.3"
objc2-web-kit = "0.3"
dispatch2 = "0.3"
