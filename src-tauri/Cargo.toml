[package]
name = "kalamos"
version = "0.1.0"
description = "Kalamos — Typora-style WYSIWYM Markdown desktop editor"
authors = ["Evan Lin"]
edition = "2021"

[lib]
name = "kalamos_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
notify = "6"
trash = "5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[dev-dependencies]
tempfile = "3"
